description: Input processor that invokes behaviors for matched events

compatible: "zmk,input-processor-behavior-trigger"

include: ip_zero_param.yaml

properties:
  type:
    type: int
  codes:
    type: array
    required: true
  bindings:
    type: phandle-array
    required: true
  timeout-ms:
    type: int
    description: Delay after the last matching event before invoking timeout-bindings.
  timeout-bindings:
    type: phandle-array
    description: Behavior invoked after timeout-ms has elapsed since the last matching event.
