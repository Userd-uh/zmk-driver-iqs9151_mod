description: Input processor that switches to a layer and returns after inactivity

compatible: "zmk,input-processor-layer-timeout"

include: ip_zero_param.yaml

properties:
  type:
    type: int
  codes:
    type: array
    required: true
  layer:
    type: int
    required: true
    description: Layer selected when a matching input event is observed.
  timeout-ms:
    type: int
    required: true
    description: Delay after the last matching event before selecting timeout-layer.
  timeout-layer:
    type: int
    required: true
    description: Layer selected after timeout-ms has elapsed.
